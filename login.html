<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản - CyberTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/responsive.css?v=5">
</head>
<body style="background: #f1f5f9;">

  <!-- SIMPLE HEADER -->
  <header style="background: #fff; padding: 1.25rem 0; border-bottom: 1px solid var(--gray-200); text-align: center;">
    <a href="index.html" class="logo" style="display: inline-flex;">
      <i class="fas fa-microchip"></i>
      <span>CYBER</span>TECH
      <span class="logo-badge">PC STORE</span>
    </a>
  </header>

  <!-- AUTH CONTAINER -->
  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h2>Đăng Nhập</h2>
        <p>Truy cập tài khoản CyberTech của bạn để quản lý đơn hàng</p>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Địa chỉ Email <span class="req">*</span></label>
          <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu <span class="req">*</span></label>
          <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu..." required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fas fa-sign-in-alt"></i> Đăng Nhập
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a> | <a href="index.html">Quay về trang chủ</a>
      </div>
    </div>
  </main>

  <script src="js/products-data.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;

      if (loginUser(email, pass)) {
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      }
    }
  </script>
</body>
</html>
