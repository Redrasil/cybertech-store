<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi Mật Khẩu - CyberTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="stylesheet" href="css/responsive.css?v=4">
</head>
<body style="background: #f1f5f9;">

  <header style="background: #fff; padding: 1.25rem 0; border-bottom: 1px solid var(--gray-200); text-align: center;">
    <a href="index.html" class="logo" style="display: inline-flex;">
      <i class="fas fa-microchip"></i>
      <span>CYBER</span>TECH
      <span class="logo-badge">PC STORE</span>
    </a>
  </header>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h2>Đổi Mật Khẩu</h2>
        <p>Cập nhật mật khẩu mới để bảo mật tài khoản</p>
      </div>

      <div id="logged-user-alert" style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 0.75rem 1rem; font-size: 0.88rem; color: #1e40af; margin-bottom: 1.5rem;">
        <!-- Filled by JS -->
      </div>

      <form id="change-pass-form" onsubmit="handleChangePassSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="old-password">Mật khẩu hiện tại <span class="req">*</span></label>
          <input type="password" id="old-password" class="form-control" placeholder="Nhập mật khẩu hiện tại..." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-password">Mật khẩu mới <span class="req">*</span></label>
          <input type="password" id="new-password" class="form-control" placeholder="Mật khẩu mới tối thiểu 3 ký tự..." required minlength="3">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-new-password">Xác nhận mật khẩu mới <span class="req">*</span></label>
          <input type="password" id="confirm-new-password" class="form-control" placeholder="Nhập lại mật khẩu mới..." required minlength="3">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fas fa-key"></i> Xác Nhận Đổi Mật Khẩu
        </button>
      </form>

      <div class="auth-footer">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Quay về trang chủ</a>
      </div>
    </div>
  </main>

  <script src="js/products-data.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      const alertBox = document.getElementById('logged-user-alert');
      if (user) {
        alertBox.innerHTML = `<i class="fas fa-user-check"></i> Đang đăng nhập: <strong>${user.name}</strong> (${user.email})`;
      } else {
        alertBox.className = "upload-instruction";
        alertBox.style.background = "#fef2f2";
        alertBox.style.borderColor = "var(--danger)";
        alertBox.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i> Bạn chưa đăng nhập! Vui lòng <a href="login.html" style="color: var(--primary); font-weight: bold; text-decoration: underline;">Đăng nhập</a> trước khi đổi mật khẩu.`;
        document.getElementById('change-pass-form').style.display = 'none';
      }
    });

    function handleChangePassSubmit(e) {
      e.preventDefault();
      const oldPass = document.getElementById('old-password').value;
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-new-password').value;

      if (newPass !== confirmPass) {
        showToast('Mật khẩu mới xác nhận không khớp!', 'error');
        return;
      }

      if (changePassword(oldPass, newPass)) {
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      }
    }
  </script>
</body>
</html>
