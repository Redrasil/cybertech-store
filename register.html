<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản Mới - CyberTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/responsive.css?v=5">
</head>
<body style="background: #f1f5f9;">

  <header style="background: #fff; padding: 1.25rem 0; border-bottom: 1px solid var(--gray-200); text-align: center;">
    <a href="index.html" class="logo" style="display: inline-flex;">
      <i class="fas fa-microchip"></i>
      <span>CYBER</span>TECH
      <span class="logo-badge">PC STORE</span>
    </a>
  </header>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h2>Tạo Tài Khoản Mới</h2>
        <p>Gia nhập cộng đồng người yêu công nghệ CyberTech</p>
      </div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Họ và tên <span class="req">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Địa chỉ Email <span class="req">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Mật khẩu <span class="req">*</span></label>
          <input type="password" id="reg-password" class="form-control" placeholder="Tối thiểu 6 ký tự..." required minlength="3">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Xác nhận mật khẩu <span class="req">*</span></label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Nhập lại mật khẩu..." required minlength="3">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fas fa-user-plus"></i> Đăng Ký Tài Khoản
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a> | <a href="index.html">Về trang chủ</a>
      </div>
    </div>
  </main>

  <script src="js/products-data.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
  <script>
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (pass !== confirm) {
        showToast('Mật khẩu xác nhận không khớp!', 'error');
        return;
      }

      if (registerUser(name, email, pass)) {
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      }
    }
  </script>
</body>
</html>
